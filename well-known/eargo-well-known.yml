source: >-
  live GET of /.well-known/* on every Eargo host resolved from DNS enumeration of
  eargo.com plus the parent-company host lxehearing.com
summary: >-
  Eargo itself serves no .well-known document it authored. Round two enumerated four
  hosts the first pass had missed — app.eargo.com (a live Rails "Eargo Web App"),
  help.eargo.com (an Intercom-hosted consumer help center), shop.eargo.com and
  store.eargo.com — and probed all of them. The only HTTP 200 carrying a real document
  is https://help.eargo.com/.well-known/security.txt, and it is NOT Eargo's: it is
  Intercom's platform-default RFC 9116 file, served by the help-center vendor, whose own
  `Canonical:` field points at https://app.intercom.com/.well-known/security.txt and
  whose Contact/Policy route to bugcrowd.com/intercom. Because that document makes no
  claim about Eargo and Eargo did not author it, NO SecurityTxt and NO Security pointer
  is emitted, and no WellKnown pointer either — crediting Eargo with a vendor's
  disclosure program would be exactly the soft-credit failure this probe exists to
  prevent. Every other 200 in this file is an SPA/soft-404 catch-all shell, and
  api.eargo.com answers 403 on every path behind Cloudflare bot management.
