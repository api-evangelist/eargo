aid: eargo
name: Eargo
description: 'Eargo was a San Jose, California direct-to-consumer medical device company
  that designed and sold rechargeable, virtually invisible in-canal hearing aids for
  adults with mild to moderate hearing loss, founded in 2010 as Aria Innovations and
  listed on Nasdaq in 2020. In 2025 Eargo merged with South Africa''s hearX Group to
  form LXE Hearing, combining Eargo''s direct-to-consumer platform with the Lexie and
  Go Hearing over-the-counter brands. In 2026 LXE Hearing began winding down its US
  operations after restructuring efforts failed, and the eargo.com website has been
  reduced to a single wind-down notice page. Eargo never operated a public developer
  program, developer portal, or documented API: the hearing aids paired with a
  consumer mobile application backed by a private, undocumented service host at
  api.eargo.com.'
