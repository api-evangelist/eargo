summary: >-
  Eargo publishes no API versioning policy, no deprecation policy, no SLA and no status
  page — it never operated a developer program. What it does publish is a corporate
  end-of-life notice: parent company LXE Hearing (formed by the 2025 merger of Eargo and
  hearX Group) began winding down its US operations in 2026, and eargo.com has been
  reduced to that single notice page. This artifact records the product/company
  lifecycle, not an API lifecycle.
api_lifecycle:
